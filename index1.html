<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบสร้างใบชั่งน้ำหนัก</title>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Sarabun', Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      min-height: 100vh;
    }

    .topbar {
      background: #1e3a8a;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .topbar p {
      margin: 2px 0 0;
      color: #dbeafe;
      font-size: 14px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      display: grid;
      grid-template-columns: 1fr 180px 180px auto;
      gap: 12px;
      margin-bottom: 18px;
      align-items: center;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-green {
      background: #16a34a;
      color: white;
    }

    .btn-orange {
      background: #f97316;
      color: white;
    }

    .btn-red {
      background: #dc2626;
      color: white;
    }

    .btn-gray {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-outline {
      background: white;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    .panel-title {
      margin: 0 0 14px;
      color: #1e3a8a;
      font-size: 20px;
      font-weight: 800;
      border-bottom: 2px solid #dbeafe;
      padding-bottom: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 5px;
    }

    .section-title {
      grid-column: 1 / -1;
      margin: 14px 0 2px;
      color: #f97316;
      font-size: 17px;
      font-weight: 800;
      border-left: 4px solid #f97316;
      padding-left: 10px;
    }

    .readonly {
      background: #f9fafb;
      color: #374151;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }

    th,
    td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      font-size: 14px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
      font-weight: 800;
      text-align: center;
    }

    td.center {
      text-align: center;
    }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .status-pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .status-completed {
      background: #dcfce7;
      color: #15803d;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #b91c1c;
    }

    .table-actions {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .table-actions button {
      padding: 6px 9px;
      font-size: 13px;
      border-radius: 8px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 28px;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      background: #f9fafb;
    }

    .print-area {
      background: white;
      color: #000;
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: auto;
    }

    .slip {
      width: 210mm;
      min-height: 145mm;
      margin: 0 auto;
      background: #fff;
      color: #000;
      padding: 12mm;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    .slip-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .slip-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .slip-header p {
      margin: 4px 0;
      font-size: 13px;
    }

    .slip-title-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin: 14px 0;
      font-weight: 800;
      font-size: 18px;
    }

    .slip-title-row .center-title {
      text-align: center;
      font-size: 20px;
    }

    .slip-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 20px;
      margin-bottom: 12px;
    }

    .slip-info div {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
    }

    .slip-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 14px;
    }

    .slip-table th,
    .slip-table td {
      border: 1px solid #000;
      padding: 6px;
      color: #000;
    }

    .summary-box {
      margin-left: auto;
      margin-top: 12px;
      width: 320px;
      border: 1px solid #000;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      border-bottom: 1px solid #000;
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-row div {
      padding: 6px 8px;
    }

    .summary-row div:last-child {
      text-align: right;
      border-left: 1px solid #000;
      font-weight: 700;
    }

    .signature {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 45px;
      text-align: center;
    }

    .signature-line {
      border-top: 1px solid #000;
      padding-top: 6px;
    }

    .mobile-card {
      display: none;
    }

    @media (max-width: 980px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .desktop-table {
        display: none;
      }

      .mobile-card {
        display: grid;
        gap: 12px;
      }

      .ticket-card {
        background: #fff;
        border: 1px solid #dbeafe;
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      }

      .ticket-card h3 {
        margin: 0 0 8px;
        color: #1e40af;
      }

      .ticket-card p {
        margin: 4px 0;
      }

      .slip {
        width: 100%;
        min-width: 760px;
      }
    }

    @media print {
      body {
        background: #fff !important;
        margin: 0 !important;
      }

      .no-print {
        display: none !important;
      }

      .container {
        max-width: none !important;
        padding: 0 !important;
      }

      .print-area {
        border: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
        overflow: visible !important;
      }

      .slip {
        width: 210mm !important;
        min-height: 145mm !important;
        border: 0 !important;
        margin: 0 auto !important;
        padding: 8mm !important;
        box-shadow: none !important;
      }

      @page {
        size: A4 portrait;
        margin: 8mm;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar no-print">
      <div>
        <h1>ระบบสร้างใบชั่งน้ำหนัก</h1>
        <p>เพิ่ม แก้ไข จัดการ และพิมพ์ใบชั่ง</p>
      </div>
      <button class="btn btn-outline" onclick="window.print()">พิมพ์ Preview</button>
    </div>

    <div class="container">
      <div class="toolbar no-print">
        <input id="searchInput" type="text" placeholder="ค้นหาเลขที่ใบชั่ง / ลูกค้า / ทะเบียนรถ" oninput="renderTickets()" />
        <select id="statusFilter" onchange="renderTickets()">
          <option value="">ทุกสถานะ</option>
          <option value="pending">รอชั่งออก</option>
          <option value="completed">เสร็จสมบูรณ์</option>
          <option value="cancelled">ยกเลิก</option>
        </select>
        <input id="dateFilter" type="date" onchange="renderTickets()" />
        <button class="btn btn-primary" onclick="newTicket()">+ เพิ่มใบชั่ง</button>
      </div>

      <div class="grid no-print">
        <div class="panel">
          <h2 class="panel-title">รายการใบชั่ง</h2>

          <div class="desktop-table">
            <table>
              <thead>
                <tr>
                  <th>เลขที่ใบชั่ง</th>
                  <th>ลูกค้า</th>
                  <th>ทะเบียนรถ</th>
                  <th>สินค้า</th>
                  <th>น้ำหนักสุทธิ</th>
                  <th>สถานะ</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="ticketTableBody"></tbody>
            </table>
          </div>

          <div id="ticketCards" class="mobile-card"></div>
        </div>

        <div class="panel">
          <h2 class="panel-title" id="formTitle">เพิ่มใบชั่ง</h2>

          <form id="ticketForm" onsubmit="saveTicket(event)">
            <input type="hidden" id="editingId" />

            <div class="form-grid">
              <div class="section-title">ข้อมูลใบชั่ง</div>

              <div class="field">
                <label>เลขที่ใบชั่ง</label>
                <input id="ticketNo" required />
              </div>

              <div class="field">
                <label>วันที่สร้าง</label>
                <input id="createdDate" type="date" required />
              </div>

              <div class="field">
                <label>ชื่อลูกค้า</label>
                <input id="customerName" required />
              </div>

              <div class="field">
                <label>สินค้า</label>
                <input id="productName" required />
              </div>

              <div class="field">
                <label>ประเภทรถ</label>
                <input id="vehicleType" placeholder="เช่น เทรนเลอร์" />
              </div>

              <div class="field">
                <label>ราคา / กก.</label>
                <input id="price" type="number" step="0.01" value="0" oninput="calculate()" />
              </div>

              <div class="field">
                <label>พนักงานชั่ง</label>
                <input id="scaleStaffName" />
              </div>

              <div class="field">
                <label>พนักงานขับรถ</label>
                <input id="driverName" />
              </div>

              <div class="field" style="grid-column:1/-1;">
                <label>หมายเหตุ</label>
                <textarea id="note"></textarea>
              </div>

              <div class="section-title">ข้อมูลรถ</div>

              <div class="field">
                <label>ทะเบียนรถ</label>
                <input id="licensePlate" placeholder="70-2722/2723" />
              </div>

              <div class="field">
                <label>จังหวัดทะเบียน</label>
                <input id="licenseProvince" placeholder="นครศรีธรรมราช" />
              </div>

              <div class="section-title">ข้อมูลน้ำหนัก</div>

              <div class="field">
                <label>วันเวลาเข้า</label>
                <input id="weighInAt" type="datetime-local" />
              </div>

              <div class="field">
                <label>น้ำหนักเข้า</label>
                <input id="weightIn" type="number" step="0.01" value="0" oninput="calculate()" />
              </div>

              <div class="field">
                <label>วันเวลาออก</label>
                <input id="weighOutAt" type="datetime-local" />
              </div>

              <div class="field">
                <label>น้ำหนักออก</label>
                <input id="weightOut" type="number" step="0.01" value="0" oninput="calculate()" />
              </div>

              <div class="field">
                <label>น้ำหนักสุทธิ</label>
                <input id="netWeight" class="readonly" readonly />
              </div>

              <div class="field">
                <label>ความชื้น / สิ่งเจือปน</label>
                <input id="deductionWeight" type="number" step="0.01" value="0" oninput="calculate()" />
              </div>

              <div class="field">
                <label>น้ำหนักคงเหลือ</label>
                <input id="finalWeight" class="readonly" readonly />
              </div>

              <div class="field">
                <label>สถานะ</label>
                <select id="status">
                  <option value="pending">รอชั่งออก</option>
                  <option value="completed">เสร็จสมบูรณ์</option>
                  <option value="cancelled">ยกเลิก</option>
                </select>
              </div>

              <div class="section-title">ข้อมูลเงิน</div>

              <div class="field">
                <label>จำนวนเงิน</label>
                <input id="amount" class="readonly" readonly />
              </div>

              <div class="field">
                <label>เงินหัก</label>
                <input id="moneyDeduct" type="number" step="0.01" value="0" oninput="calculate()" />
              </div>

              <div class="field">
                <label>เงินคงเหลือ</label>
                <input id="balance" class="readonly" readonly />
              </div>
            </div>

            <div class="actions">
              <button class="btn btn-green" type="submit">บันทึก</button>
              <button class="btn btn-orange" type="button" onclick="saveAndPrint()">บันทึกและพิมพ์</button>
              <button class="btn btn-gray" type="button" onclick="resetForm()">ล้างฟอร์ม</button>
            </div>
          </form>
        </div>
      </div>

      <div class="panel" style="margin-top:18px;">
        <h2 class="panel-title no-print">Preview ใบชั่ง</h2>
        <div class="print-area">
          <div id="printSlip" class="slip"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'weigh_tickets_v1';
    let tickets = [];
    let selectedId = null;

    const company = {
      name: 'บริษัท แอล.ที. การยาง จำกัด',
      address: '541 ม.3 จันดี ฉวาง นครศรีธรรมราช - 80250',
      tel: '075-445-930',
      taxId: '0805523000071'
    };

    function baht(value) {
      return Number(value || 0).toLocaleString('th-TH', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function kg(value) {
      return Number(value || 0).toLocaleString('th-TH', {
        maximumFractionDigits: 2
      });
    }

    function todayDate() {
      return new Date().toISOString().slice(0, 10);
    }

    function nowLocal() {
      const date = new Date();
      const offset = date.getTimezoneOffset();
      const local = new Date(date.getTime() - offset * 60000);
      return local.toISOString().slice(0, 16);
    }

    function formatDateTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;

      return date.toLocaleString('th-TH', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function onlyDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;

      return date.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    function onlyTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;

      return date.toLocaleTimeString('th-TH', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function generateTicketNo() {
      const now = new Date();
      const yy = String(now.getFullYear() + 543).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const countToday = tickets.filter(t => (t.createdDate || '').slice(0, 10) === todayDate()).length + 1;
      return `LTR${yy}${mm}${dd}-${String(countToday).padStart(2, '0')}`;
    }

    function loadTickets() {
      tickets = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      if (tickets.length === 0) {
        const demo = {
          id: crypto.randomUUID(),
          ticketNo: 'LTR260506-16',
          createdDate: todayDate(),
          customerName: 'สหกรณ์กองทุนสวนยางพาราทองผาภูมิ จำกัด',
          productName: 'ยางแผ่นดิบ',
          vehicleType: 'เทรนเลอร์',
          price: 0,
          note: '',
          scaleStaffName: 'สิทธิพร สวัสดีเมือง',
          driverName: '',
          licensePlate: '70-2722/2723',
          licenseProvince: 'นครศรีธรรมราช',
          weighInAt: '2026-05-06T09:20',
          weightIn: 15660,
          weighOutAt: '2026-05-06T15:06',
          weightOut: 49680,
          netWeight: 34020,
          deductionWeight: 0,
          finalWeight: 34020,
          amount: 0,
          moneyDeduct: 0,
          balance: 0,
          status: 'completed',
          updatedAt: new Date().toISOString()
        };

        tickets.push(demo);
        saveStorage();
      }
    }

    function saveStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
    }

    function calculate() {
      const weightIn = Number(document.getElementById('weightIn').value || 0);
      const weightOut = Number(document.getElementById('weightOut').value || 0);
      const deductionWeight = Number(document.getElementById('deductionWeight').value || 0);
      const price = Number(document.getElementById('price').value || 0);
      const moneyDeduct = Number(document.getElementById('moneyDeduct').value || 0);

      const netWeight = Math.max(weightOut - weightIn, 0);
      const finalWeight = Math.max(netWeight - deductionWeight, 0);
      const amount = finalWeight * price;
      const balance = amount - moneyDeduct;

      document.getElementById('netWeight').value = netWeight.toFixed(2);
      document.getElementById('finalWeight').value = finalWeight.toFixed(2);
      document.getElementById('amount').value = amount.toFixed(2);
      document.getElementById('balance').value = balance.toFixed(2);

      if (weightIn > 0 && weightOut > 0) {
        document.getElementById('status').value = 'completed';
      } else if (weightIn > 0 && weightOut <= 0) {
        document.getElementById('status').value = 'pending';
      }
    }

    function getFormData() {
      calculate();

      return {
        id: document.getElementById('editingId').value || crypto.randomUUID(),
        ticketNo: document.getElementById('ticketNo').value.trim(),
        creat
