<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบสร้างใบชั่งน้ำหนัก</title>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Sarabun', Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    .no-print {}

    .topbar {
      background: #1e3a8a;
      color: white;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .topbar p {
      margin: 2px 0 0;
      color: #dbeafe;
      font-size: 14px;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }

    .panel h2 {
      margin: 0 0 14px;
      color: #1e3a8a;
      font-size: 20px;
      font-weight: 800;
      border-bottom: 2px solid #dbeafe;
      padding-bottom: 8px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: #374151;
      margin-bottom: 5px;
    }

    .section-title {
      grid-column: 1 / -1;
      margin-top: 12px;
      padding-left: 10px;
      border-left: 4px solid #f97316;
      color: #f97316;
      font-weight: 800;
      font-size: 17px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary { background: #2563eb; color: white; }
    .btn-green { background: #16a34a; color: white; }
    .btn-orange { background: #f97316; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-gray { background: #e5e7eb; color: #111827; }
    .btn-outline {
      background: white;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #e5e7eb;
      padding: 9px;
      font-size: 14px;
      vertical-align: top;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
      text-align: center;
      font-weight: 800;
    }

    .center {
      text-align: center;
    }

    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-pending { background: #fff7ed; color: #c2410c; }
    .status-completed { background: #dcfce7; color: #15803d; }
    .status-cancelled { background: #fee2e2; color: #b91c1c; }

    .table-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .table-actions .btn {
      padding: 6px 9px;
      font-size: 13px;
      border-radius: 8px;
    }

    .print-panel {
      margin-top: 18px;
    }

    .print-area {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      overflow: auto;
    }

    /* =========================
       ใบชั่งแบบเอกสารทางการ
    ========================== */

    .slip {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #ffffff;
      color: #000;
      padding: 18mm 20mm;
      border: 1px solid #e5e7eb;
      font-size: 15px;
      line-height: 1.75;
      position: relative;
    }

    .slip-page {
      position: absolute;
      top: 12mm;
      right: 18mm;
      font-size: 16px;
    }

    .slip-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin-top: 10mm;
      margin-bottom: 8mm;
    }

    .company-block {
      margin-bottom: 10mm;
      line-height: 1.8;
      font-size: 15px;
    }

    .company-block strong {
      font-weight: 800;
    }

    .doc-title {
      text-align: center;
      font-weight: 800;
      font-size: 20px;
      margin: 8mm 0;
      text-decoration: underline;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 20px;
      margin: 8mm 0;
    }

    .info-line {
      display: grid;
      grid-template-columns: 115px 1fr;
      gap: 8px;
      border-bottom: 1px dotted #999;
      padding: 3px 0;
    }

    .info-line strong {
      font-weight: 800;
    }

    .weight-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8mm;
      font-size: 14px;
    }

    .weight-table th,
    .weight-table td {
      border: 1px solid #000;
      padding: 7px 8px;
      color: #000;
    }

    .weight-table th {
      background: #f3f4f6;
      font-weight: 800;
      text-align: center;
    }

    .summary-box {
      margin-top: 8mm;
      margin-left: auto;
      width: 88mm;
      border: 1px solid #000;
    }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 32mm;
      border-bottom: 1px solid #000;
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-row div {
      padding: 6px 8px;
    }

    .summary-row div:last-child {
      border-left: 1px solid #000;
      text-align: right;
      font-weight: 700;
    }

    .note-box {
      margin-top: 8mm;
      min-height: 22mm;
      border: 1px solid #000;
      padding: 8px;
    }

    .signature {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28mm;
      margin-top: 24mm;
      text-align: center;
    }

    .signature-line {
      border-top: 1px solid #000;
      padding-top: 6px;
    }

    .official-footer {
      margin-top: 18mm;
      text-align: center;
      line-height: 1.9;
    }

    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .slip {
        min-width: 210mm;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      body {
        background: #fff !important;
        margin: 0 !important;
      }

      .no-print {
        display: none !important;
      }

      .container {
        max-width: none !important;
        padding: 0 !important;
      }

      .print-panel {
        margin: 0 !important;
      }

      .print-area {
        padding: 0 !important;
        border: 0 !important;
        background: #fff !important;
        overflow: visible !important;
      }

      .slip {
        width: 210mm !important;
        min-height: 297mm !important;
        border: 0 !important;
        margin: 0 !important;
        padding: 18mm 20mm !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="topbar no-print">
    <div>
      <h1>ระบบสร้างใบชั่งน้ำหนัก</h1>
      <p>สร้างใบชั่ง เพิ่ม แก้ไข จัดการ และสั่งพิมพ์</p>
    </div>

    <button class="btn btn-outline" onclick="window.print()">พิมพ์ใบชั่ง</button>
  </div>

  <div class="container">
    <div class="grid no-print">
      <div class="panel">
        <h2>รายการใบชั่ง</h2>

        <div class="toolbar">
          <input id="searchInput" placeholder="ค้นหาเลขที่ใบชั่ง / ลูกค้า / ทะเบียนรถ" oninput="renderTickets()" />
          <select id="statusFilter" onchange="renderTickets()">
            <option value="">ทุกสถานะ</option>
            <option value="pending">รอชั่งออก</option>
            <option value="completed">เสร็จสมบูรณ์</option>
            <option value="cancelled">ยกเลิก</option>
          </select>
          <button class="btn btn-primary" onclick="newTicket()">+ เพิ่มใบชั่ง</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>เลขที่</th>
              <th>ลูกค้า</th>
              <th>ทะเบียนรถ</th>
              <th>สุทธิ</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="ticketTableBody"></tbody>
        </table>
      </div>

      <div class="panel">
        <h2 id="formTitle">เพิ่มใบชั่ง</h2>

        <form id="ticketForm" onsubmit="saveTicket(event)">
          <input type="hidden" id="editingId" />

          <div class="form-grid">
            <div class="section-title">ข้อมูลเอกสาร</div>

            <div class="field">
              <label>เลขที่ใบชั่ง</label>
              <input id="ticketNo" required />
            </div>

            <div class="field">
              <label>วันที่เอกสาร</label>
              <input id="docDate" type="date" required />
            </div>

            <div class="field">
              <label>ชื่อลูกค้า</label>
              <input id="customerName" required />
            </div>

            <div class="field">
              <label>สินค้า</label>
              <input id="productName" required />
            </div>

            <div class="field">
              <label>ทะเบียนรถ</label>
              <input id="licensePlate" />
            </div>

            <div class="field">
              <label>จังหวัดทะเบียน</label>
              <input id="licenseProvince" />
            </div>

            <div class="field">
              <label>พนักงานชั่ง</label>
              <input id="scaleStaffName" />
            </div>

            <div class="field">
              <label>พนักงานขับรถ</label>
              <input id="driverName" />
            </div>

            <div class="section-title">ข้อมูลน้ำหนัก</div>

            <div class="field">
              <label>วันเวลาเข้า</label>
              <input id="weighInAt" type="datetime-local" />
            </div>

            <div class="field">
              <label>น้ำหนักเข้า</label>
              <input id="weightIn" type="number" step="0.01" value="0" oninput="calculate()" />
            </div>

            <div class="field">
              <label>วันเวลาออก</label>
              <input id="weighOutAt" type="datetime-local" />
            </div>

            <div class="field">
              <label>น้ำหนักออก</label>
              <input id="weightOut" type="number" step="0.01" value="0" oninput="calculate()" />
            </div>

            <div class="field">
              <label>น้ำหนักสุทธิ</label>
              <input id="netWeight" readonly />
            </div>

            <div class="field">
              <label>หักน้ำหนัก</label>
              <input id="deductWeight" type="number" step="0.01" value="0" oninput="calculate()" />
            </div>

            <div class="field">
              <label>น้ำหนักคงเหลือ</label>
              <input id="finalWeight" readonly />
            </div>

            <div class="field">
              <label>สถานะ</label>
              <select id="status">
                <option value="pending">รอชั่งออก</option>
                <option value="completed">เสร็จสมบูรณ์</option>
                <option value="cancelled">ยกเลิก</option>
              </select>
            </div>

            <div class="field" style="grid-column:1/-1;">
              <label>หมายเหตุ</label>
              <textarea id="note"></textarea>
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-green" type="submit">บันทึก</button>
            <button class="btn btn-orange" type="button" onclick="saveAndPrint()">บันทึกและพิมพ์</button>
            <button class="btn btn-gray" type="button" onclick="resetForm()">ล้างฟอร์ม</button>
          </div>
        </form>
      </div>
    </div>

    <div class="panel print-panel">
      <h2 class="no-print">ตัวอย่างใบชั่ง</h2>
      <div class="print-area">
        <div id="printSlip" class="slip"></div>
      </div>
    </div>
  </div>
  div class="panel print-panel">
      <h2 class="no-print">ตัวอย่างใบชั่ง</h2>
      <div class="print-area">
        <div id="printSlip" class="slip"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'official_weight_slips_v1';

    const company = {
      name: 'บริษัท แอล.ที. การยาง จำกัด',
      address: 'สถานที่ตั้ง เลขที่ 541 หมู่ที่ 3 ถนนจันดี-ลานสกา ตำบลจันดี อำเภอฉวาง จังหวัดนครศรีธรรมราช',
      tel: '075-445930',
      business: 'ประกอบกิจการ ผลิตยางแผ่นรมควัน'
    };

    let tickets = [];
    let selectedId = null;

    function todayDate() {
      return new Date().toISOString().slice(0, 10);
    }

    function nowLocal() {
      const d = new Date();
      const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

    function formatDate(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    function formatTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleTimeString('th-TH', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function num(value) {
      return Number(value || 0).toLocaleString('th-TH', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function generateTicketNo() {
      const d = new Date();
      const y = String(d.getFullYear() + 543).slice(-2);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const count = tickets.length + 1;
      return `WS${y}${m}${day}-${String(count).padStart(3, '0')}`;
    }

    function loadTickets() {
      tickets = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

      if (tickets.length === 0) {
        tickets.push({
          id: crypto.randomUUID(),
          ticketNo: 'WS680507-001',
          docDate: todayDate(),
          customerName: 'Chocolate Factory',
          productName: 'ยางแผ่นรมควัน',
          licensePlate: '80-7618/7619',
          licenseProvince: 'กรุงเทพมหานคร',
          scaleStaffName: 'สิทธิพร สวัสดีเมือง',
          driverName: 'สมชาย',
          weighInAt: nowLocal(),
          weightIn: 3400,
          weighOutAt: '',
          weightOut: 0,
          netWeight: 0,
          deductWeight: 0,
          finalWeight: 0,
          status: 'pending',
          note: 'ตัวอย่างข้อมูลใบชั่ง'
        });
        saveStorage();
      }
    }

    function saveStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
    }

    function calculate() {
      const weightIn = Number(document.getElementById('weightIn').value || 0);
      const weightOut = Number(document.getElementById('weightOut').value || 0);
      const deductWeight = Number(document.getElementById('deductWeight').value || 0);

      const netWeight = Math.abs(weightOut - weightIn);
      const finalWeight = Math.max(netWeight - deductWeight, 0);

      document.getElementById('netWeight').value = netWeight.toFixed(2);
      document.getElementById('finalWeight').value = finalWeight.toFixed(2);

      if (weightIn > 0 && weightOut > 0) {
        document.getElementById('status').value = 'completed';
      } else if (weightIn > 0) {
        document.getElementById('status').value = 'pending';
      }
    }

    function getFormData() {
      calculate();

      return {
        id: document.getElementById('editingId').value || crypto.randomUUID(),
        ticketNo: document.getElementById('ticketNo').value.trim(),
        docDate: document.getElementById('docDate').value,
        customerName: document.getElementById('customerName').value.trim(),
        productName: document.getElementById('productName').value.trim(),
        licensePlate: document.getElementById('licensePlate').value.trim(),
        licenseProvince: document.getElementById('licenseProvince').value.trim(),
        scaleStaffName: document.getElementById('scaleStaffName').value.trim(),
        driverName: document.getElementById('driverName').value.trim(),
        weighInAt: document.getElementById('weighInAt').value,
        weightIn: Number(document.getElementById('weightIn').value || 0),
        weighOutAt: document.getElementById('weighOutAt').value,
        weightOut: Number(document.getElementById('weightOut').value || 0),
        netWeight: Number(document.getElementById('netWeight').value || 0),
        deductWeight: Number(document.getElementById('deductWeight').value || 0),
        finalWeight: Number(document.getElementById('finalWeight').value || 0),
        status: document.getElementById('status').value,
        note: document.getElementById('note').value.trim()
      };
    }

    function saveTicket(event) {
      if (event) event.preventDefault();

      const data = getFormData();

      if (!data.ticketNo || !data.customerName || !data.productName) {
        alert('กรุณากรอกเลขที่ใบชั่ง ลูกค้า และสินค้า');
        return null;
      }

      const index = tickets.findIndex(item => item.id === data.id);

      if (index >= 0) {
        tickets[index] = data;
      } else {
        tickets.unshift(data);
      }

      selectedId = data.id;
      saveStorage();
      renderTickets();
      renderSlip(data);
      resetForm(false);

      return data;
    }

    function saveAndPrint() {
      const data = saveTicket();
      if (data) {
        setTimeout(() => window.print(), 200);
      }
    }

    function resetForm(createNew = true) {
      document.getElementById('ticketForm').reset();
      document.getElementById('editingId').value = '';
      document.getElementById('formTitle').innerText = 'เพิ่มใบชั่ง';

      if (createNew) {
        document.getElementById('ticketNo').value = generateTicketNo();
        document.getElementById('docDate').value = todayDate();
        document.getElementById('weighInAt').value = nowLocal();
      }

      document.getElementById('weightIn').value = 0;
      document.getElementById('weightOut').value = 0;
      document.getElementById('deductWeight').value = 0;
      document.getElementById('status').value = 'pending';
      calculate();
    }

    function newTicket() {
      resetForm(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function editTicket(id) {
      const item = tickets.find(t => t.id === id);
      if (!item) return;

      selectedId = id;
      document.getElementById('formTitle').innerText = 'แก้ไขใบชั่ง';
      document.getElementById('editingId').value = item.id;
      document.getElementById('ticketNo').value = item.ticketNo || '';
      document.getElementById('docDate').value = item.docDate || todayDate();
      document.getElementById('customerName').value = item.customerName || '';
      document.getElementById('productName').value = item.productName || '';
      document.getElementById('licensePlate').value = item.licensePlate || '';
      document.getElementById('licenseProvince').value = item.licenseProvince || '';
      document.getElementById('scaleStaffName').value = item.scaleStaffName || '';
      document.getElementById('driverName').value = item.driverName || '';
      document.getElementById('weighInAt').value = item.weighInAt || '';
      document.getElementById('weightIn').value = item.weightIn || 0;
      document.getElementById('weighOutAt').value = item.weighOutAt || '';
      document.getElementById('weightOut').value = item.weightOut || 0;
      document.getElementById('deductWeight').value = item.deductWeight || 0;
      document.getElementById('status').value = item.status || 'pending';
      document.getElementById('note').value = item.note || '';

      calculate();
      renderSlip(item);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function printTicket(id) {
      const item = tickets.find(t => t.id === id);
      if (!item) return;

      selectedId = id;
      renderSlip(item);
      setTimeout(() => window.print(), 200);
    }

    function deleteTicket(id) {
      if (!confirm('ยืนยันการลบใบชั่งนี้?')) return;

      tickets = tickets.filter(t => t.id !== id);
      saveStorage();
      renderTickets();

      renderSlip(tickets[0] || null);
    }

    function statusLabel(status) {
      if (status === 'completed') return '<span class="status status-completed">เสร็จสมบูรณ์</span>';
      if (status === 'cancelled') return '<span class="status status-cancelled">ยกเลิก</span>';
      return '<span class="status status-pending">รอชั่งออก</span>';
    }

    function renderTickets() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const list = tickets.filter(item => {
        const text = `${item.ticketNo} ${item.customerName} ${item.licensePlate} ${item.productName}`.toLowerCase();
        return (!search || text.includes(search)) && (!status || item.status === status);
      });

      const tbody = document.getElementById('ticketTableBody');

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="center">ไม่พบข้อมูล</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(item => `
        <tr>
          <td><strong>${item.ticketNo}</strong></td>
          <td>${item.customerName || '-'}</td>
          <td>${item.licensePlate || '-'} ${item.licenseProvince || ''}</td>
          <td class="center">${num(item.finalWeight)}</td>
          <td class="center">${statusLabel(item.status)}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-green" onclick="editTicket('${item.id}')">แก้ไข</button>
              <button class="btn btn-orange" onclick="printTicket('${item.id}')">พิมพ์</button>
              <button class="btn btn-red" onclick="deleteTicket('${item.id}')">ลบ</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderSlip(item) {
      const el = document.getElementById('printSlip');

      if (!item) {
        el.innerHTML = '<div style="text-align:center; padding:40px;">ยังไม่มีข้อมูลใบชั่ง</div>';
        return;
      }

      el.innerHTML = `
        <div class="slip-page">1/1</div>

        <div class="slip-title">ใบชั่งน้ำหนัก</div>

        <div class="company-block">
          <strong>${company.name}</strong><br>
          ${company.address}<br>
          โทรศัพท์ ${company.tel}<br>
          ${company.business}
        </div>

        <div class="doc-title">รายละเอียดใบชั่ง</div>

        <div class="info-grid">
          <div class="info-line"><strong>เลขที่ใบชั่ง</strong><span>${item.ticketNo || '-'}</span></div>
          <div class="info-line"><strong>วันที่เอกสาร</strong><span>${formatDate(item.docDate)}</span></div>

          <div class="info-line"><strong>ชื่อลูกค้า</strong><span>${item.customerName || '-'}</span></div>
          <div class="info-line"><strong>สินค้า</strong><span>${item.productName || '-'}</span></div>

          <div class="info-line"><strong>ทะเบียนรถ</strong><span>${item.licensePlate || '-'} ${item.licenseProvince || ''}</span></div>
          <div class="info-line"><strong>พนักงานขับรถ</strong><span>${item.driverName || '-'}</span></div>

          <div class="info-line"><strong>พนักงานชั่ง</strong><span>${item.scaleStaffName || '-'}</span></div>
          <div class="info-line"><strong>สถานะ</strong><span>${item.status === 'completed' ? 'เสร็จสมบูรณ์' : item.status === 'cancelled' ? 'ยกเลิก' : 'รอชั่งออก'}</span></div>
        </div>

        <table class="weight-table">
          <thead>
            <tr>
              <th style="width:90px;">รายการ</th>
              <th>วันที่</th>
              <th>เวลา</th>
              <th>น้ำหนัก กก.</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="center"><strong>ชั่งเข้า</strong></td>
              <td class="center">${formatDate(item.weighInAt)}</td>
              <td class="center">${formatTime(item.weighInAt)}</td>
              <td style="text-align:right;">${num(item.weightIn)}</td>
            </tr>
            <tr>
              <td class="center"><strong>ชั่งออก</strong></td>
              <td class="center">${formatDate(item.weighOutAt)}</td>
              <td class="center">${formatTime(item.weighOutAt)}</td>
              <td style="text-align:right;">${num(item.weightOut)}</td>
            </tr>
          </tbody>
        </table>

        <div class="summary-box">
          <div class="summary-row">
            <div>น้ำหนักสุทธิ</div>
            <div>${num(item.netWeight)}</div>
          </div>
          <div class="summary-row">
            <div>หักน้ำหนัก</div>
            <div>${num(item.deductWeight)}</div>
          </div>
          <div class="summary-row">
            <div><strong>น้ำหนักคงเหลือ</strong></div>
            <div>${num(item.finalWeight)}</div>
          </div>
        </div>

        <div class="note-box">
          <strong>หมายเหตุ:</strong><br>
          ${item.note || '-'}
        </div>

        <div class="signature">
          <div>
            <div class="signature-line">ลงชื่อ พนักงานชั่ง</div>
          </div>
          <div>
            <div class="signature-line">ลงชื่อ พนักงานขับรถ / ผู้ส่งมอบ</div>
          </div>
        </div>

        <div class="official-footer">
          เอกสารนี้ออกโดยระบบสร้างใบชั่งน้ำหนัก<br>
          กรุณาตรวจสอบข้อมูลก่อนลงนาม
        </div>
      `;
    }

    function init() {
      loadTickets();
      resetForm(true);
      renderTickets();
      renderSlip(tickets[0]);
    }

    init();
  </script>
</body>
</html>
