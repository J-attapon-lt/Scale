<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบสร้างใบชั่งน้ำหนัก</title>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Sarabun", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #eef2f7;
      color: #111827;
    }

    .app-header {
      background: #1e3a8a;
      color: #fff;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .app-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .app-header p {
      margin: 3px 0 0;
      color: #dbeafe;
      font-size: 14px;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: 430px 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .panel h2 {
      margin: 0 0 14px;
      color: #1e3a8a;
      font-size: 20px;
      font-weight: 800;
      border-bottom: 2px solid #dbeafe;
      padding-bottom: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 9px 10px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 64px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .section-title {
      grid-column: 1 / -1;
      margin-top: 8px;
      color: #f97316;
      font-weight: 800;
      border-left: 4px solid #f97316;
      padding-left: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-blue {
      background: #2563eb;
      color: #fff;
    }

    .btn-green {
      background: #16a34a;
      color: #fff;
    }

    .btn-gray {
      background: #e5e7eb;
      color: #111827;
    }

    .preview-wrap {
      overflow: auto;
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      padding: 18px;
    }

    /* ==========================
       ใบชั่ง ตามไฟล์ต้นฉบับ
    =========================== */

    .weight-slip {
      width: 210mm;
      min-height: 148mm;
      background: #fff;
      color: #000;
      margin: 0 auto;
      padding: 10mm 12mm 8mm;
      border: 1px solid #d1d5db;
      position: relative;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .slip-top {
      display: block;
      margin-bottom: 6px;
      text-align: center;
    }

    .slip-title {
      text-align: center;
      font-weight: 800;
      font-size: 20px;
      white-space: nowrap;
      margin-bottom: 8px; /* ลงมา 1 enter จากหัวใบชั่ง */
    }

    .slip-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .slip-no {
      font-weight: 700;
      white-space: nowrap;
      text-align: left;
    }

    .slip-date {
      margin-left: auto;
      text-align: right;
      white-space: nowrap;
    }

    .info-row {
      display: grid;
      grid-template-columns: 85px 1fr 90px 1fr;
      gap: 6px;
      margin: 3px 0;
      align-items: center;
    }

    .info-row.three {
      grid-template-columns: 85px 1fr 90px 130px;
    }

    .label {
      font-weight: 700;
    }

    .value {
      border-bottom: 0px dotted #777;
      min-height: 20px;
      padding: 0 4px;
    }

    .blank {
      min-height: 20px;
    }

    .main-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }

    .main-table th,
    .main-table td {
      border: 1px solid #000;
      padding: 5px 6px;
      vertical-align: middle;
    }

    .main-table th {
      font-weight: 800;
      text-align: center;
      background: #f3f4f6;
    }

    .center {
      text-align: center;
    }

    .right {
      text-align: right;
    }

    .summary-area {
      display: grid;
      grid-template-columns: 1fr 72mm;
      gap: 10px;
      margin-top: 8px;
      align-items: start;
    }

    .note-box {
      border: 1px solid #000;
      min-height: 38mm;
      padding: 7px;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .summary-table td {
      border: 1px solid #000;
      padding: 5px 7px;
    }

    .summary-table td:first-child {
      font-weight: 700;
    }

    .summary-table td:last-child {
      text-align: right;
      width: 34mm;
    }

    .signature-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16mm;
      margin-top: 18mm;
      text-align: center;
      font-size: 13px;
    }

    .signature-line {
      border-top: 1px solid #000;
      padding-top: 5px;
    }



    @media (max-width: 1100px) {
      .container {
        grid-template-columns: 1fr;
      }

      .weight-slip {
        min-width: 210mm;
      }
    }

    @media (max-width: 768px) {
      .app-header {
        padding: 12px 14px;
      }

      .app-header h1 {
        font-size: 18px;
      }

      .container {
        padding: 10px;
        gap: 12px;
      }

      .panel {
        padding: 12px;
        border-radius: 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .preview-wrap {
        padding: 8px;
      }

      .weight-slip {
        width: 100%;
        min-width: 0;
        min-height: auto;
        padding: 10px;
        font-size: 12px;
      }

      .slip-title {
        font-size: 18px;
        margin-bottom: 8px;
      }

      .slip-meta {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .slip-no {
        text-align: left;
        white-space: normal;
      }

      .slip-date {
        margin-left: auto;
        text-align: right;
        white-space: nowrap;
      }

      .info-row,
      .info-row.three {
        grid-template-columns: 78px 1fr;
      }
    }

    @media print {
      @page {
       size: 210mm 130mm !important;
        margin: 0 !important;
      }

      body {
        background: #fff !important;
      }

      .no-print,
      .app-header,
      .panel.form-panel h2,
      .form-panel,
      .preview-title {
        display: none !important;
      }

      .container {
        display: block !important;
        max-width: none !important;
        padding: 0 !important;
      }

      .panel {
        box-shadow: none !important;
        border: 0 !important;
        padding: 0 !important;
      }

      .preview-wrap {
        padding: 0 !important;
        border: 0 !important;
        background: #fff !important;
        overflow: visible !important;
      }

      .weight-slip {
        width: 210mm !important;
        min-height: 130mm !important;
        border: 0 !important;
        margin: 0 auto !important;
        padding: 8mm 10mm 7mm !important;
      }
    }
  </style>
</head>

<body>
  <header class="app-header no-print">
    <div>
      <h1>ระบบสร้างใบชั่งน้ำหนัก</h1>
      <p>แบบฟอร์มใบชั่งตามไฟล์ต้นฉบับ</p>
    </div>
    <button class="btn-green" onclick="window.print()">พิมพ์ใบชั่ง</button>
  </header>

  <main class="container">
    <section class="panel form-panel no-print">
      <h2>กรอกข้อมูลใบชั่ง</h2>

      <div class="form-grid">
        <div class="section-title">ข้อมูลหลัก</div>

        <div class="field">
          <label>เลขที่ใบชั่ง </label>
          <input id="ticketNo" value="LTR250517-11" oninput="renderSlip()" />
        </div>

        <div class="field">
          <label>วันที่ออกเอกสาร</label>
          <input id="docDate" value="17/05/2568 14:39:30" oninput="renderSlip()" />
        </div>

        <div class="field full">
          <label>ชื่อลูกค้า</label>
          <input id="customerName" value="สหกรณ์กองทุนสวนยางพาราทองผาภูมิ จำกัด" oninput="renderSlip()" />
        </div>

        <div class="field">
          <label>พนักงานชั่ง</label>
          <input id="scaleStaff" value="อรรถพล เจ๊ะโซ๊ะ" oninput="renderSlip()" />
        </div>

        <div class="field">
          <label>สินค้า</label>
          <input id="productName" value="ยางแผ่นดิบ" oninput="renderSlip()" />
        </div>

        <div class="field">
          <label>ประเภทรถ</label>
          <input id="truckType" value="เทรนเลอร์" oninput="renderSlip()" />
        </div>

        
       

        <div class="section-title">ข้อมูลชั่งเข้า</div>

        <div class="field">
          <label>ทะเบียนรถเข้า</label>
          <input id="inPlate" value="70-4923/70-4924 นครศรีธรรมราช" oninput="syncOutFromIn(); renderSlip()" />
        </div>

        <div class="field">
          <label>วันที่เข้า</label>
          <input id="inDate" value="17/05/2568" oninput="syncOutFromIn(); renderSlip()" />
        </div>

        <div class="field">
          <label>เวลาเข้า</label>
          <input id="inTime" value="08:09:37" oninput="renderSlip()" />
        </div>

        <div class="field">
          <label>น้ำหนักเข้า</label>
          <input id="inWeight" type="number" value="15730" oninput="calculateAndRender()" />
        </div>

        <div class="section-title">ข้อมูลชั่งออก</div>

        <input id="outPlate" type="hidden" value="70-4923/70-4924 นครศรีธรรมราช" />
        <input id="outDate" type="hidden" value="17/05/2568" />

        <div class="field">
          <label>เวลาออก</label>
          <input id="outTime" value="14:39:30" oninput="renderSlip()" />
        </div>

        <div class="field">
          <label>น้ำหนักออก</label>
          <input id="outWeight" type="number" value="48690" oninput="calculateAndRender()" />
        </div>

        <div class="section-title">สรุปน้ำหนัก</div>

        <div class="field">
          <label>นน. สุทธิ</label>
          <input id="netWeight" readonly />
        </div>

        <div class="field">
          <label>ความชื้น / สิ่งเจือปน</label>
          <input id="deductWeight" type="number" value="0" oninput="calculateAndRender()" />
        </div>

        <div class="field">
          <label>นน. คงเหลือ</label>
          <input id="finalWeight" readonly />
        </div>
      </div>

      <div class="actions">
        <button class="btn-blue" onclick="renderSlip()">อัปเดตตัวอย่าง</button>
        <button class="btn-green" onclick="window.print()">พิมพ์</button>
        <button class="btn-gray" onclick="resetExample()">รีเซ็ตตัวอย่าง</button>
      </div>
    </section>

    <section class="panel">
      <h2 class="preview-title no-print">ตัวอย่างใบชั่ง</h2>

      <div class="preview-wrap">
        <div id="slip" class="weight-slip"></div>
      </div>
    </section>
  </main>

  <script>
    
                     
  const companyFooter = `
    
  `;

  const $ = (id) => {
    const element = document.getElementById(id);
    if (!element) console.error(`ไม่พบ element id="${id}"`);
    return element;
  };

  function money(value) {
    return Number(value || 0).toLocaleString("th-TH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function weight(value) {
    return Number(value || 0).toLocaleString("th-TH", {
      maximumFractionDigits: 0
    });
  }

  function getValue(id) {
    const el = $(id);
    return el ? el.value : "";
  }

  function setValue(id, value) {
    const el = $(id);
    if (el) el.value = value;
  }

  function syncOutFromIn() {
    setValue("outPlate", getValue("inPlate"));
    setValue("outDate", getValue("inDate"));
  }

  function calculate() {
    const inWeight = Number(getValue("inWeight") || 0);
    const outWeight = Number(getValue("outWeight") || 0);
    const deductWeight = Number(getValue("deductWeight") || 0);

    const netWeight = Math.abs(outWeight - inWeight);
    const finalWeight = Math.max(netWeight - deductWeight, 0);

    setValue("netWeight", netWeight);
    setValue("finalWeight", finalWeight);

    return {
      netWeight,
      finalWeight,
      deductWeight
    };
  }

  function calculateAndRender() {
    calculate();
    renderSlip();
  }

  function renderSlip() {
    const slip = $("slip");
    if (!slip) return;

    syncOutFromIn();
    const summary = calculate();

    slip.innerHTML = `
      <div class="slip-top">
        <div class="slip-title">ใบชั่งน้ำหนัก</div>
        <div class="slip-meta">
          <div class="slip-no">เลขที่ใบชั่ง ${getValue("ticketNo") || "-"}</div>
          <div class="slip-date">วันที่ ${getValue("docDate") || "-"}</div>
        </div>
      </div>

      <div class="info-row">
        <div class="label">ชื่อลูกค้า</div>
        <div class="value">${getValue("customerName") || "-"}</div>
        <div class="label">พนักงานชั่ง</div>
        <div class="value">${getValue("scaleStaff") || "-"}</div>
      </div>

      <div class="info-row">
        <div class="label">สินค้า</div>
        <div class="value">${getValue("productName") || "-"}</div>
        <div class="label">ประเภทรถ</div>
        <div class="value">${getValue("truckType") || "-"}</div>
      </div>

      <div class="info-row three">
        
        <div class="label">หมายเหตุ</div>
        <div class="value">${getValue("note") || ""}</div>
      </div>
<div style="
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  font-family: 'Sarabun', Arial, sans-serif;
  color: #000;
">
<p></p>
  <table style="
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 15px;
    height: 30px;
  ">
    <thead>
      <tr>
        <th style="border:1px solid #000; padding:6px; width:15%; text-align:center;">รายการ</th>
        <th style="border:1px solid #000; padding:6px; width:35%; text-align:center;">ทะเบียนรถ</th>
        <th style="border:1px solid #000; padding:6px; width:15%; text-align:center;">วันที่</th>
        <th style="border:1px solid #000; padding:6px; width:15%; text-align:center;">เวลา</th>
        <th style="border:1px solid #000; padding:6px; width:15%; text-align:center;">น้ำหนัก</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td style="border:1px solid #000; padding:6px; height:42px; text-align:center;">
          เข้า
        </td>
        <td style="border:1px solid #000; padding:6px;">
          ${getValue("inPlate") || "-"}
        </td>
        <td style="border:1px solid #000; padding:6px; text-align:center;">
          ${getValue("inDate") || "-"}
        </td>
        <td style="border:1px solid #000; padding:6px; text-align:center;">
          ${getValue("inTime") || "-"}
        </td>
        <td style="border:1px solid #000; padding:6px; text-align:right;">
          ${weight(getValue("inWeight"))}
        </td>
      </tr>

      <tr>
        <td style="border:1px solid #000; padding:6px; height:42px; text-align:center;">
          ออก
        </td>
        <td style="border:1px solid #000; padding:6px;">
          ${getValue("outPlate") || "-"}
        </td>
        <td style="border:1px solid #000; padding:6px; text-align:center;">
          ${getValue("outDate") || "-"}
        </td>
        <td style="border:1px solid #000; padding:6px; text-align:center;">
          ${getValue("outTime") || "-"}
        </td>
        <td style="border:1px solid #000; padding:6px; text-align:right;">
          ${weight(getValue("outWeight"))}
        </td>
      </tr>

      <tr>
        <!-- ช่องลายเซ็นซ้าย กินพื้นที่ 3 คอลัมน์ -->
        <td colspan="3" style="
          height:135px;
          vertical-align:bottom;
          border:none;
          padding:0px 0px 0px 0px;
        ">
          <div style="display:flex; justify-content:space-between; gap:24px;">
            <div style="width:48%; text-align:center;">
              <div style="border-top:1px solid #000; padding-top:6px;">
                พนักงานชั่ง
              </div>
            </div>

            <div style="width:48%; text-align:center;">
              <div style="border-top:1px solid #000; padding-top:6px;">
                พนักงานขับรถ
              </div>
            </div>
          </div>
        </td>
        
        <td colspan="2" style="
          height:130px;
          vertical-align:top;
          border-collapse: collapse;
          padding:0;
        ">
          <table style="
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 16px;
  ">
    <thead>

            <tr>
              <td style="border:1px solid #000; padding:6px; height:42px; text-align:right;">
               <b> นน. สุทธิ</b>
              </td>
              <td style="border:1px solid #000; padding:6px; text-align:right;">
                ${weight(summary.netWeight)}
              </td>
            </tr>
            <tr>
              <td style="border:1px solid #000; padding:6px; height:42px; text-align:right;">
               <b> นน. คงเหลือ  </b>
              </td>
              <td style="border:1px solid #000; padding:6px; height:42px; text-align:right;">
                ${weight(summary.finalWeight)}
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </tbody>
  </table>

</div> 
    `;
  }

  function resetExample() {
    setValue("ticketNo", "LTR250517-11");
    setValue("docDate", "17/05/2568 14:39:30");
    setValue("customerName", "สหกรณ์กองทุนสวนยางพาราทองผาภูมิ จำกัด");
    setValue("scaleStaff", "อรรถพล เจ๊ะโซ๊ะ");
    setValue("productName", "ยางแผ่นดิบ");
    setValue("truckType", "เทรนเลอร์");
    setValue("price", "0");
    setValue("note", "");

    setValue("inPlate", "70-4923/70-4924 นครศรีธรรมราช");
    setValue("inDate", "17/05/2568");
    setValue("inTime", "08:09:37");
    setValue("inWeight", "15730");

    syncOutFromIn();
    setValue("outTime", "14:39:30");
    setValue("outWeight", "48690");

    setValue("deductWeight", "0");

    calculateAndRender();
  }

  document.addEventListener("DOMContentLoaded", () => {
    calculateAndRender();
  });
</script>
